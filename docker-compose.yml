services:
  # ── Redis de cache (páginas públicas) ──────────────────────
  # Descartável: pode perder chaves por eviction e não grava em disco.
  redis-cache:
    image: redis:8.2-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis da fila (BullMQ / analytics) ─────────────────────
  # Durável: o BullMQ exige noeviction; AOF mantém os jobs após reinício.
  redis-queue:
    image: redis:8.2-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Postgres descartável para os testes de lock (profile db-test) ──
  # Não sobe com `docker compose up`: use `docker compose --profile db-test up -d`.
  # Sem volume: os dados somem ao remover o container.
  postgres-test:
    profiles: ["db-test"]
    image: postgres:17-alpine
    command: postgres -c lynko.disposable=yes
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lynko_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lynko_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Proxy HTTP/WebSocket compatível com o driver @neondatabase/serverless.
  neon-proxy-test:
    profiles: ["db-test"]
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres-test:5432/lynko_test
    ports:
      - "127.0.0.1:4444:4444"
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  redis_queue_data:
